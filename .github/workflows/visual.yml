name: Visual

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/visual.yml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/react/package.json
      - packages/react/vitest.visual.config.ts
      - packages/react/visual/**
      - packages/react/src/**
      - packages/utils/src/**
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Visual - Setup
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      baseline_run_id: ${{ steps.baseline.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Resolve browser image
        id: image
        run: |
          version=$(sed -n 's/^  playwright: //p' pnpm-workspace.yaml)
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

      - name: Resolve baseline run
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow visual.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

  visual:
    name: Visual - Chromium
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }} # zizmor: ignore[unpinned-images] Version is resolved from pnpm-workspace.yaml.
      options: --user 1001 --init --ipc=host
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      compared: ${{ steps.compare.outcome != 'skipped' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install
        uses: $/.github/composite-actions/install

      - name: Download baseline
        id: baseline
        if: ${{ needs.prepare.outputs.baseline_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-baseline
          path: packages/react/visual-baseline
          run-id: ${{ needs.prepare.outputs.baseline_run_id }}
          github-token: ${{ github.token }}

      - name: Compare
        id: compare
        if: ${{ github.event_name == 'pull_request' && steps.baseline.outcome == 'success' }}
        continue-on-error: true
        run: pnpm react test:visual --reporter=default --reporter=json --outputFile.json=visual-report.json

      - name: Check report
        if: ${{ steps.compare.outcome == 'failure' }}
        run: test -f packages/react/visual-report.json

      - name: Update baseline
        if: ${{ github.event_name == 'push' || steps.baseline.outcome != 'success' }}
        run: pnpm react test:visual --update

      - name: Upload baseline
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baseline
          path: packages/react/visual-baseline
          retention-days: 30
          if-no-files-found: error

      - name: Upload report
        if: ${{ steps.compare.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: packages/react/visual-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload diff
        if: ${{ steps.compare.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diff
          path: packages/react/.vitest/attachments
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  report:
    name: Visual - Report
    needs: visual
    if: ${{ needs.visual.outputs.compared == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visual-report

      - name: Summarize
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -r --arg run_url "$RUN_URL" '
            [.testResults[].assertionResults[] | select(.status == "failed")] as $failed
            | if ($failed | length) == 0 then
                "No visual changes."
              else
                "**\($failed | length) stories changed visually.** Download the `visual-diff` artifact from the [workflow run](\($run_url)) to see the images.\n\n| Story | Changed pixels |\n| --- | --- |\n"
                + ($failed | map(
                    (.failureMessages | join(" ") | capture("(?<pixels>[0-9]+) pixels") // { pixels: "-" }) as $diff
                    | "| \(.title) | \($diff.pixels) |"
                  ) | join("\n"))
              end
          ' visual-report.json | tee visual-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- visual -->'
          body="${marker}"$'\n'"$(cat visual-report.md)"
          id=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${id}" -f body="$body" --silent
          elif [ "$(cat visual-report.md)" != "No visual changes." ]; then
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" --silent
          fi
