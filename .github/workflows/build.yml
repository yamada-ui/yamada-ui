name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      TURBO_SCM_BASE:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_SCM_BASE: ${{ inputs.TURBO_SCM_BASE }}
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build --affected

  www:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build documentation
        run: pnpm www build --affected
