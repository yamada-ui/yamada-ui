name: Verify Firefox isolation

on:
  pull_request:
    paths:
      - .github/workflows/verify-firefox-isolation.yml
      - packages/react/vitest.config.ts

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: image
        run: |
          version=$(sed -n 's/^  playwright: //p' pnpm-workspace.yaml)
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  verify:
    name: Firefox - ${{ matrix.mode }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ${{ needs.prepare.outputs.image }}
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        mode: [parallel, serial]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: ./.github/composite-actions/install
      - name: Restore baseline configuration
        if: matrix.mode == 'parallel'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:packages/react/vitest.config.ts" > packages/react/vitest.config.ts
      - name: Repeat without retries or Turbo cache
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p diagnostics
          failed=0
          for iteration in 1 2 3 4 5; do
            set +e
            pnpm react test:firefox --run src/components/date-picker/date-picker-focus.test.firefox.tsx src/components/select/select.test.browser.tsx src/components/popover/popover.test.browser.tsx --retry=0 --maxWorkers=4 --reporter=verbose 2>&1 | tee "diagnostics/run-$iteration.log"
            status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "$MODE" "$iteration" "$status" | tee -a diagnostics/results.tsv
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done
          if [ "$MODE" = serial ]; then
            exit "$failed"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefox-isolation-${{ matrix.mode }}
          path: diagnostics
          retention-days: 7
